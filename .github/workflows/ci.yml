# Pull requests into develop/main only: a merge replays nothing, the PR was
# checked. `changes` classifies the diff; every job is skipped when its files
# did not change, and `ci` is the one status to require. On a release
# (workflow_call) everything runs. Fuzzing and advisories: scheduled.yml.
name: CI

on:
  pull_request:
    branches: [develop, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the files of the pull request
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      oracle: ${{ github.event_name != 'pull_request' || steps.filter.outputs.oracle == 'true' }}
      data: ${{ github.event_name != 'pull_request' || steps.filter.outputs.data == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust: &rust
              - "src/**"
              - "README.md" # included by src/lib.rs: doctests and cargo doc
              - "benches/**"
              - "tests/**"
              - "examples/**"
              - "Cargo.*"
              - ".github/workflows/**"
            oracle:
              - *rust
              - "tools/oracle/**"
            data:
              - "data/**"
              - "tools/check-data-files.sh"

  core:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ybdn-ei/.github/.github/workflows/rust-ci.yml@main
    with:
      msrv: "1.85"
      feature-sets: '["", "--all-features"]'
    secrets: inherit

  bench:
    name: Benchmarks (build)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo bench --no-run

  oracle:
    name: Oracle (nistitl 0.6)
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install nistitl==0.6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Synthetic corpus (seed = run number)
        run: python -I tools/oracle/gen_corpus.py "$RUNNER_TEMP/corpus" 20000 "$GITHUB_RUN_NUMBER"
      - name: Compare with nistitl
        run: cargo test --release --test oracle
        env:
          ANSI_NIST_ITL_CORPUS: ${{ runner.temp }}/corpus
          ANSI_NIST_ITL_PYTHON: python

  data:
    name: Data files (DATA-04)
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tools/check-data-files.sh

  # The one status to read: green when every needed job passed or was skipped.
  ci:
    if: ${{ !cancelled() }}
    needs: [changes, core, bench, oracle, data]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo ok
